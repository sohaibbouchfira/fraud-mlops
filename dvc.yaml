stages:
  train:
    cmd: python src/train.py
    deps: [src/train.py, src/features.py, data/transactions.csv]
    params: [seed, test_size, model]
    outs: [models/model.pkl, models/run_info.json]
  evaluate:
    cmd: python src/evaluate.py
    deps: [src/evaluate.py, src/features.py, models/model.pkl, data/transactions.csv]
    params: [seed, test_size, gates]
    metrics:
      - metrics.json:
          cache: false
